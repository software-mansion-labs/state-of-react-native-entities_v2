- id: standard_library_and_official_solutions
  name: Standarized solutions
  description: Requests for official, built-in solutions (Navigation, Router, State Management) to reduce fragmentation.
  patterns:
    - standard
    - official
    - built-in
    - built in
    - unified

- id: native_language_support
  name: Native support
  description: Requests for better support of native segments.
  patterns:
    - swift
    - kotlin
    - c\+\+
    - cpp
    - spm
    - rust
    - native module
    - bridge
    - turbo module

- id: native_features
  name: Native features
  description: Requests for more native features and modules
  patterns:
    - native

- id: debugging_and_profiling
  name: Debugging and profiling
  description: Requests for better debugging tools, network inspection, and performance profiling.
  patterns:
    - debug(ging)?
    - inspector
    - network
    - profiling
    - dev( |-)?tool(ing|s)?
    - logging
    - console, logs? [l]

