- id: survey_length
  description: Found the survey too long
  patterns:
    - too long
    - shorter
    - shorten
    - fatigue
    - remove some blocks
    - less questions
    - compact

- id: information_links
  description: Add features info links during the survey
  patterns:
    - links
    - docs
    - documentation
    - resources
    - tutorials?

- id: dark_mode
  description: Requests for Dark Mode support
  patterns:
    - dark mode
    - dark theme

- id: light_mode
  description: Suggested adding a light mode to the user interface
  patterns:
    - light theme

- id: positive_impression
  description: Overall positive impression of the survey
  patterns:
    - doing great
    - doing a great
    - great job
    - perfect
    - are good
    - are great
    - is great
    - it'?s great
    - it'?s best
    - best survey
    - pretty good
    - pretty great
    - all good
    - good
    - all great
    - all is fine
    - i like it
    - it's fine
    - it's good
    - it's ok
    - its fine
    - its good
    - its ok
    - no notes
    - fantastic
    - love it
    - excellent
    - 10/10
    - liked

- id: dont_know
  description: No specific suggestion
  patterns:
    - don't know
    - idk
    - no idea
    - no need
    - nothing
    - no much improvement

- id: options_suggestion
  description: Suggested improving the options provided for existing questions
  patterns:
    - option list
    - list of options
    - predefined list
    - other option
    - missing options
    - more options
    - add options

- id: countries
  description: Suggested improvements over the list of countries
  patterns:
    - countries
    - country

- id: questions_suggestion
  description: Suggested adding, removing, or changing questions
  patterns:
    - more questions
    - different type of question
    - when asking

- id: translations
  description: Better-quality or more complete translations
  patterns:
    - translating
    - localization
    - translation

- id: live_code_examples
  description: Interactive or visual code examples
  patterns:
    - interactive
    - visual

- id: sentiment_ui
  description: Sentiment UI improvements
  patterns:
    - favorable opinion
    - sentiment

- id: ui_improvements
  description: General UI improvements
  patterns:
    - enter
    - textbox
    - button
    - submit
    - checkbox
    - mobile

- id: marketing_reach
  description: Suggestions to improve marketing and reach of the survey
  patterns:
    - marketing
    - promote
    - penetration
    - referral
    - channels

- id: mobile_version
  description: Better mobile version
  patterns: []

- id: accessibility
  name: Accessibility
  description: Accessibility improvements
  patterns:
    - accessibility
