- id: breakpoints
  name: Breakpoints
  patterns:
    - break( |-)?point

# removed due to a consistent downward trend in usage (as of 2025-09-01, ref: https://npmtrends.com/react-native-flipper)
# - id: fliper
#   name: Fliper
#   patterns:
#     - fliper
#     - flipper

- id: network
  name: Network
  patterns:
    - network [p]

- id: react_dev_tools
  name: React Dev Tools
  patterns:
    - react( |-)?dev( |-)?tools
    - react( |-)?dev( |-)?tool
    - react( |-)?dev( |-)?tool.*

- id: reliability
  name: Reliability
  patterns:
    - reliability
    - not, stable [l]
    - breaks
    - fails to
    - limited
    - doesn't, work [l]
    - crash [p]

- id: platforms_inconsistencies
  name: Platforms inconsistencies
  patterns:
    - across platform
    - across

- id: radon_ide
  name: Radon IDE
  patterns:
    - radon ide

- id: launching
  name: Launching
  patterns:
    - can't start
    - cannot access
    - connecting to
    - connection
    - reload

- id: web_devtools_parity
  name: Web devtools parity
  patterns:
    - web experience
    - web dev
    - with, web [l]

- id: styles
  name: Styles
  patterns:
    - pixel perfect
    - inspect.*styling
    - inspect.*styles

- id: separate_window
  name: Separate window
  patterns:
    - separate window
    - chrome
    - chromium

- id: debugging_in_general
  name: Debugging in general
  patterns:
    - debugging in general

- id: console_logs_missing
  name: Console logs missing
  description: Console logs are no longer visible in a terminal
  patterns:
    - log[s]?, missing [l]
    - log[s]?, terminal [l]
    - log[s]?, removed [l]

- id: devtools_connection
  name: DevTools connection issues
  patterns:
    - disconnect
    - reconnect
    - restart
    - connection
