- id: tailwind_support
  name: Tailwind support
  patterns:
    - tailwind.*support

- id: light_dark_theme
  name: Light/dark theme
  patterns:
    - light.*dark
    - dark.*light
    - theme
    - theming
    - dark

- id: nativewind
  name: Nativewind
  patterns:
    - native[ ]?wind

- id: shadows
  name: Shadows
  patterns:
    - shadow
    - shadows

- id: tamagui
  name: Tamagui
  patterns:
    - tamagui

- id: grid
  name: Grid
  patterns:
    - grid

- id: animations
  name: Animations
  patterns:
    - animation
    - animated
    - animating

- id: cross_platform_consistency
  name: Cross platform support
  patterns:
    - (in)?consistency.*platform[s]?
    - consistency
    - consistent
    - code sharing
    - web (and|&) native
    - web (and|&) mobile
    - web (and|&) ios
    - inconsistencies
    - platform style
    - cross.*platform
    - ios.*android
    - android.*ios
    - native.*web
    - platform.*difference
    - different platform
    - platform discrepancy

- id: responsiveness
  name: Responsiveness
  patterns:
    - responsive
    - responsiveness [p]
    - break( |-)points
    - (multiple|different) [\w]* sizes

- id: lack_of_css_api
  name: Lack of CSS API
  patterns:
    - css api
    - css web
    - css functionality
    - css cascade[s]?
    - css property
    - css properties
    - limited css
    - css parity
    - web primitives
    - lack of css
    - like css
    - css[ |-]like
    - css.*support(ed)?
    - css features

- id: web_issues
  name: Web issues
  patterns:
    - web.*only
    - css in web
    - web support

- id: types
  name: Types
  patterns:
    - definition
    - typescript
    - type( |-)?safe

- id: styled_components
  name: Styled components
  patterns:
    - styled component

- id: architecture
  name: Architecture
  patterns:
    - large stylesheet
    - guidelines
    - code.*organized
    - keep.*simple [p]
    - modularity
    - reusable, style [l]

- id: devtools
  name: Devtools
  patterns:
    - dev( |-)?tool

- id: global_styling
  name: Global styling
  patterns:
    - global styling

- id: stylesheet_api
  name: StyleSheet API
  patterns:
    - stylesheet
    - stylesheets

- id: large_ecosystem
  name: Large ecosystem
  description: No built-in standards
  patterns:
    - large ecosystem
    - no standard
    - need.*standard
